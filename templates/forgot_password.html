{% extends "base.html" %}
{% block title %}Forgot Password - GJPP{% endblock %}
{% block extra_css %}
<style>
.pg{min-height:62vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;}
.form-card{background:#fff;border-radius:16px;border:1.5px solid var(--border);box-shadow:var(--shadow-lg);overflow:hidden;width:100%;max-width:440px;}
.form-head{padding:2rem 1.5rem;background:linear-gradient(135deg,var(--jain-blue),var(--blue-mid));text-align:center;}
.form-head .icon{font-size:2.4rem;margin-bottom:0.5rem;display:block;}
.form-head h1{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:800;color:#fff;}
.form-head p{color:rgba(255,255,255,0.6);font-size:0.83rem;margin-top:0.25rem;}
.form-body{padding:1.5rem;}
</style>
{% endblock %}
{% block content %}
<div class="pg">
  <div class="form-card">
    <div class="form-head">
      <span class="icon">🔑</span>
      <h1>Reset Password</h1>
      <p>Enter your email and we'll send a reset link.</p>
    </div>
    <div class="form-body">
      <form method="POST" action="/forgot-password">
        <div class="form-group"><label class="form-label">Email Address <span>*</span></label><input type="email" name="email" class="form-input" placeholder="your@email.com" required></div>
        <button type="submit" class="btn btn-blue btn-lg btn-block">Send Reset Link</button>
        <div style="text-align:center;margin-top:1rem;">
          <a href="/login" style="font-size:0.85rem;color:var(--jain-blue);font-weight:700;text-decoration:none;">← Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
